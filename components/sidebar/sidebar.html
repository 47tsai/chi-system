<!-- chi-system Sidebar — 唯一實作（SPEC.md §6）。
     適用門檻：本站導覽 ≥5 個頂層區段，或為動態分類，才用側邊欄版式；否則用 header＋副導覽列。
     收合開關在側邊欄頂列右側；收合 key 只有一個存放位置：引入 sidebar.js 的
     <script data-chi-sidebar-key="chi-<站點>-sidebar-collapsed">，<aside> 上不寫 key。
     佔位符：{{site.url}} {{site.name}} {{site.logo}}；{{slots.nav}} 為本站導覽連結。 -->
<aside class="chi-sidebar" aria-label="本站導覽">
  <div class="chi-sidebar__top">
    <a class="chi-sidebar__brand" href="{{site.url}}">
      <img class="chi-sidebar__logo chi-sidebar__logo--light" src="{{site.logoLight}}" alt="{{site.name}}" width="32" height="32">
      <img class="chi-sidebar__logo chi-sidebar__logo--dark" src="{{site.logoDark}}" alt="{{site.name}}" width="32" height="32">
      <span class="chi-sidebar__name">{{site.name}}</span>
    </a>
    <button class="chi-sidebar__trigger" type="button" data-chi-sidebar-toggle aria-expanded="true" aria-label="收合側邊欄" title="收合側邊欄">‹</button>
  </div>
  <nav class="chi-sidebar__nav">{{slots.nav}}</nav>
  <div class="chi-sidebar__bottom">
    <button class="chi-sidebar__theme" type="button" data-chi-theme-toggle aria-label="切換主題" title="切換主題">◐</button>
    <span class="chi-sidebar__version" data-chi-version>版本 {{version}}</span>
  </div>
</aside>
<div class="chi-sidebar__scrim" data-chi-sidebar-scrim aria-hidden="true"></div>
