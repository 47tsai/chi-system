<!-- chi-system Header — 唯一實作（SPEC.md §6）。網站不得複製修改。
     佔位符由網站建置時以 sites/<site>.json 填入：{{site.url}} {{site.name}} {{site.logoLight}} {{site.logoDark}}
     主題切換按鈕在 header 版式；側邊欄版式的站沒有 header，切換改放側邊欄底部。
     導覽不進 header，放 header 下方獨立一列（slots.subnav），沒有導覽的站省略整段。 -->
<header class="chi-header">
  <a class="chi-header__brand" href="{{site.url}}">
    <img class="chi-header__logo chi-header__logo--light" src="{{site.logoLight}}" alt="{{site.name}}" width="32" height="32">
    <img class="chi-header__logo chi-header__logo--dark" src="{{site.logoDark}}" alt="{{site.name}}" width="32" height="32">
    <span class="chi-header__name">{{site.name}}</span>
  </a>
  <div class="chi-header__actions">
    {{slots.actions}}
    <button class="chi-header__theme" type="button" data-chi-theme-toggle aria-label="切換主題" title="切換主題">
      <span aria-hidden="true">◐</span>
    </button>
  </div>
</header>
<nav class="chi-subnav" aria-label="本站導覽">{{slots.subnav}}</nav>
